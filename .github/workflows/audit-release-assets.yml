name: Audit Echelon GitHub release metadata
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect release metadata without executing downloaded code
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p evidence
          printf 'repository,status,tag,asset_count\n' > evidence/releases.csv
          for name in conditor praxis ordo dokimos aegis vigila vitium fides strata arca percepta limen forma forma-studio folio iter; do
            repo="kemiller2002/$name"
            if payload=$(gh api "repos/$repo/releases/latest" 2>/dev/null); then
              tag=$(jq -r '.tag_name' <<< "$payload")
              count=$(jq '.assets | length' <<< "$payload")
              printf '%s,FOUND,%s,%s\n' "$repo" "$tag" "$count" >> evidence/releases.csv
            else
              printf '%s,UNKNOWN_OR_NO_LATEST_RELEASE,,\n' "$repo" >> evidence/releases.csv
            fi
          done
          cat evidence/releases.csv
      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata-audit
          path: evidence/releases.csv
